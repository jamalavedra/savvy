[graph]
targets = [{ triple = "aarch64-apple-darwin" }]

[advisories]
version = 2
# There are no vulnerability advisories against this tree. Everything below is
# `unmaintained`, reached transitively and only at build time. The `[graph]` target
# above already excludes Tauri's Linux GTK3 stack, which is the other source of
# unmaintained warnings and is unreachable in a macOS build.
ignore = [
  # Reached through idna_adapter, which is build-time only. Nothing in Savvy calls
  # these directly; they leave the tree when idna updates.
  "RUSTSEC-2025-0075", # unic-char-range
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "Unlicense",
  "CC0-1.0",
  "MIT-0",
  "0BSD",
  "BSL-1.0",
]

# Published without a `license` field; its repository carries both MIT and
# Apache-2.0 license files.
[[licenses.clarify]]
name = "tauri-nspanel"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/ahkohd/tauri-nspanel"]
