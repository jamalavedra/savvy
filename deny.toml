[graph]
targets = [{ triple = "aarch64-apple-darwin" }, { triple = "x86_64-pc-windows-msvc" }]

[advisories]
version = 2
# The `[graph]` target above already excludes Tauri's Linux GTK3 stack, whose
# unmaintained crates are unreachable in a macOS build.
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "Unlicense",
  "CC0-1.0",
  "MIT-0",
  "0BSD",
  "BSL-1.0",
]

# Published without a `license` field; its repository carries both MIT and
# Apache-2.0 license files.
[[licenses.clarify]]
name = "tauri-nspanel"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/ahkohd/tauri-nspanel"]
