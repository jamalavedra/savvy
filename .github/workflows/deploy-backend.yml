name: Deploy backend

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-savvy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'jamalavedra/savvy' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:deploy-epistoma
          ping: epistoma
      - name: Deploy checked backend
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: tailscale ssh jaume@epistoma "bash -s -- $DEPLOY_SHA" < deploy/epistoma-main.sh
