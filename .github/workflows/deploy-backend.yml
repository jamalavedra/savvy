name: Deploy backend

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-savvy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'jamalavedra/savvy' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: epistoma
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: "2026.11.0"
          CLOUDFLARED_SHA256: 51f7c68b57ed7269164075d7e789efce5b59355982f06392deeb037d982a51fd
        run: |
          curl -fsSL -o /tmp/cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum -c -
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
      - name: Configure SSH to epistoma
        env:
          DEPLOY_KEY: ${{ secrets.EPISTOMA_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EPISTOMA_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/epistoma_deploy
          chmod 600 ~/.ssh/epistoma_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The Access service token passes Cloudflare; the restricted deploy key logs in.
      - name: Deploy checked backend
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          SSH_TARGET: ${{ secrets.EPISTOMA_SSH_TARGET }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: >-
          ssh -i ~/.ssh/epistoma_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o BatchMode=yes -o ServerAliveInterval=30
          -o ProxyCommand="cloudflared access ssh --hostname %h"
          "$SSH_TARGET" "bash -s -- $DEPLOY_SHA" < deploy/epistoma-main.sh
