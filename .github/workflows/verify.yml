name: "Verify"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-audio-qualification:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - run: New-Item -ItemType Directory -Force target
      - name: Backend typecheck and regression tests
        run: pnpm --dir backend typecheck && pnpm --dir backend test
      - name: Full sustained load, first run
        env:
          SAVVY_LOAD_RESULTS: ${{ github.workspace }}/target/windows-load-first.json
        run: pnpm --dir backend test:load
      - name: Full sustained load, repeat
        env:
          SAVVY_LOAD_RESULTS: ${{ github.workspace }}/target/windows-load-repeat.json
        run: pnpm --dir backend test:load
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-audio-diagnostics
          path: |
            backend/e2e/load-results.json
            target/windows-load-first.json
            target/windows-load-repeat.json
          if-no-files-found: ignore
          retention-days: 7
